{# Base head content - meta, styles, icons, feed discovery #}
{# Note: title, description, meta, canonical, and scripts are handled in base.html #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="{{ SITEURL }}/{{ MAIN_CSS_URL|default('theme/css/main.css') }}">
<link rel="alternate" type="application/atom+xml" href="{{ SITEURL }}/index.xml" title="{{ SITENAME }} Atom Feed">
<link rel="icon" href="{{ SITEURL }}/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="{{ SITEURL }}/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ SITEURL }}/android-chrome-192x192.png">
<link rel="apple-touch-icon" href="{{ SITEURL }}/apple-touch-icon.png">
<link rel="mask-icon" href="{{ SITEURL }}/safari-pinned-tab.svg" color="#a78bfa">
