name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint Python with ruff
        run: uv run ruff check pelicanconf.py publishconf.py plugins scripts

      - name: Lint Jinja templates with djlint
        run: uv run djlint --lint theme/minimal128/templates/

      - name: Build production site
        env:
          CONTEXT: production
        run: uv run pelican content -s publishconf.py

      - name: Sanity check build outputs
        run: |
          for f in output/index.html output/index.xml output/sitemap.xml output/llms.txt output/og/default.png output/404.html; do
            test -s "$f" || { echo "Missing or empty build artifact: $f"; exit 1; }
          done
          if grep -rn "{% youtube" output/posts/; then
            echo "Found unexpanded youtube tag in built output!"
            exit 1
          fi
          grep -q "<?xml-stylesheet" output/index.xml || { echo "Missing XSL stylesheet PI in output/index.xml"; exit 1; }
          grep -q "https://128bit.io" output/sitemap.xml || { echo "Missing production SITEURL in output/sitemap.xml"; exit 1; }
