# Hide Apache version
ServerTokens Prod
ServerSignature Off

# Custom 404 page
ErrorDocument 404 /404.html

# Security headers (kept in sync with netlify.toml)
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" env=HTTPS
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"

    # Fingerprinted theme CSS/JS - immutable long cache
    <LocationMatch "^/theme/(css|js)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Images and generated OG cards - 30-day cache
    <LocationMatch "^/(images|og)/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    # Atom feed - 1-hour cache
    <Location "/index.xml">
        Header set Cache-Control "public, max-age=3600"
    </Location>
</IfModule>

# Enable compression
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE application/xml application/atom+xml application/rss+xml text/xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Browser caching defaults
<IfModule mod_expires.c>
    ExpiresActive On

    # HTML & feeds - short cache
    ExpiresByType text/html "access plus 1 hour"
    ExpiresByType application/atom+xml "access plus 1 hour"
    ExpiresByType application/xml "access plus 1 hour"
    ExpiresByType text/xml "access plus 1 hour"

    # CSS/JS - long cache (fingerprinted)
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"

    # Images - 30-day cache
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
    ExpiresByType image/x-icon "access plus 1 day"

    # Fonts - long cache
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType font/woff "access plus 1 year"
</IfModule>

# ETags - use simpler method for static files
FileETag MTime Size
